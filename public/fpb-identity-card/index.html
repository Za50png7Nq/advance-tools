  <script>
    function preview(event) {
      event.preventDefault();

      const formData = {
        CifNumber: document.getElementById('CifNumber').value,
        account: document.getElementById('account').value,
        ifsc: document.getElementById('ifsc').value,
        Customer: document.getElementById('Customer').value,
        Perent: document.getElementById('Perent').value,
        mobile: document.getElementById('mobile').value,
        aadhar: document.getElementById('aadhar').value,
          Address: document.getElementById('Address').value,
            Pincode: document.getElementById('Pincode').value,
              KoName: document.getElementById('KoName').value,
              Location: document.getElementById('Location').value,


        photo: document.getElementById('photo').files[0]
      };

      
      document.getElementById('previewSection').classList.add('active');


      if (formData.photo) {
        const reader = new FileReader();
        reader.onload = function(event) {
          const img = document.getElementById('previewPhoto');
          img.src = event.target.result;
        };
        reader.readAsDataURL(formData.photo);
      }

      
      const previewTable = document.getElementById('previewTable');
      previewTable.innerHTML = `
        <tr><td>Cif Number:</td><th>${formData.CifNumber}</th></tr>
        <tr><td>Account Number:</td><th>${formData.account}</th></tr>
        <tr><td>IFSC Code:</th><th id="fpbifscOut">${formData.ifsc}</th></tr>
        <tr><td>Customer Name:</td><th>${formData.Customer}</th></tr>
        <tr><td>Father/Husband:</td><th>${formData.Perent}</th></tr>
         <tr><td>Mobile Number:</td><th>${formData.mobile}</th></tr>
        <tr><td>UID Number:</td><th>${formData.aadhar}</th></tr>
        <tr><td>Address:</td><th>${formData.Address}</th></tr>
        <tr><td>Pin Code:</td><th>${formData.Pincode}</th></tr>
         <tr><td>Kiosk Name:</td><th id="fpbkoNameOut">${formData.KoName}</th></tr>
        <tr><td>Kiosk Location:</td><th id="fpblocationOut">${formData.Location}</th></tr>
      `;
       
      document.getElementById('previewSection').style.display = 'block';
      
      document.getElementById('resumeForm').style.display = 'none';
    }
    
    function editInfo() {
      document.getElementById('previewSection').style.display = 'none';
      document.getElementById('resumeForm').style.display = 'block';
    }

    function formatNumber(input) {
            
            var cleanInput = input.value.replace(/\D/g, '');

            
            var formattedInput = cleanInput.replace(/(\d{4})/g, '$1 ').trim();

            
            input.value = formattedInput;
        }

  </script>
  <script>
const STORAGE_KEY = "kioskData";


const fields = ["ifsc", "KoName", "Location"];


fields.forEach(id => {
    const el = document.getElementById(id);
    if (el) {
        el.addEventListener("input", saveData);
    }
});

function saveData() {
    const data = {
        ifsc: document.getElementById("ifsc").value,
        KoName: document.getElementById("KoName").value,
        Location: document.getElementById("Location").value
    };

    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));

    
    if (document.getElementById("ifscOut")) {
        updatePreview(data);
    }
}

function loadData() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (!saved) return;

    const data = JSON.parse(saved);

    document.getElementById("ifsc").value = data.ifsc || "";
    document.getElementById("KoName").value = data.KoName || "";
    document.getElementById("Location").value = data.Location || "";
}

function updatePreview(data) {
    document.getElementById("fpbifscOut").innerText = data.ifsc || "";
    document.getElementById("fpbkoNameOut").innerText = data.KoName || "";
    document.getElementById("fpblocationOut").innerText = data.Location || "";
}


window.addEventListener("DOMContentLoaded", loadData);
</script>
