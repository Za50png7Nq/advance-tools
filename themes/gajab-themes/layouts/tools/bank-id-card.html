<style>
    :root{--bg-main:#0b0f17;--surface:#161b26;--surface-card:#1e2433;--surface-hover:#262d3e;--border:rgba(255,255,255,0.08);--border-highlight:rgba(255,255,255,0.15);--text-primary:#f3f4f6;--text-muted:#9ca3af;--accent:#3b82f6;--accent-glow:rgba(59,130,246,0.35);--shadow:0 12px 32px rgba(0,0,0,0.4);--sidebar-width:280px;--sidebar-collapsed-width:72px;--right-sidebar-width:280px;--right-sidebar-collapsed-width:72px;--radius-lg:16px;--radius-md:10px;--radius-sm:6px;--font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}[data-theme="light"]{--bg-main:#f3f4f6;--surface:#fff;--surface-card:#fff;--surface-hover:#e5e7eb;--border:#e2e8f0;--border-highlight:#cbd5e1;--text-primary:#0f172a;--text-muted:#64748b;--accent:#2563eb;--accent-glow:rgba(37,99,235,0.2);--shadow:0 10px 25px rgba(0,0,0,0.06)}*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}body{font-family:var(--font-family);background-color:var(--bg-main);color:var(--text-primary);transition:background-color 0.3s ease,color 0.3s ease;height:100vh;overflow:hidden}body.modal-open{overflow:hidden !important}.app-container{display:flex;width:100vw;height:100vh;overflow:hidden}.sidebar{width:var(--sidebar-width);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;justify-content:space-between;padding:16px;transition:width 0.3s cubic-bezier(0.4,0,0.2,1);z-index:20;flex-shrink:0}.sidebar.collapsed{width:var(--sidebar-collapsed-width)}.sidebar-top{display:flex;flex-direction:column;gap:14px;overflow:hidden}.sidebar-header{display:flex;align-items:center;justify-content:space-between}.brand-info{display:flex;align-items:center;gap:12px;overflow:hidden;white-space:nowrap}.brand-icon{font-size:20px;background:rgba(59,130,246,0.12);padding:10px;border-radius:var(--radius-md);color:var(--accent);flex-shrink:0}.brand-text h1{font-size:16px;font-weight:700;color:var(--text-primary)}.brand-text p{font-size:11px;color:var(--text-muted)}.sidebar.collapsed .brand-text{display:none}.collapse-btn{background:var(--surface-hover);border:1px solid var(--border);color:var(--text-primary);width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s ease;flex-shrink:0;outline:none}.collapse-btn:hover{border-color:var(--border-highlight);background:var(--accent);color:#fff}.sidebar.collapsed .collapse-btn{transform:rotate(180deg)}

    .sidebar-search input:focus{border-color:var(--accent)}
    .sidebar-search .search-icon{position:absolute;left:10px;font-size:14px;color:var(--text-muted);pointer-events:none}
    .sidebar.collapsed .sidebar-search{display:none}
    .right-sidebar.collapsed .sidebar-search{display:none}

    .link-tabs-nav{display:flex;flex-direction:column;gap:8px;overflow-y:auto;scrollbar-width:none}.link-tabs-nav::-webkit-scrollbar{display:none}.link-tab{border:1px solid transparent;background:transparent;padding:12px;border-radius:var(--radius-md);font-size:14px;font-weight:600;color:var(--text-muted);cursor:pointer;transition:all 0.2s ease;display:flex;align-items:center;gap:12px;white-space:nowrap;width:100%;outline:none}.tab-icon{font-size:16px;flex-shrink:0;width:20px;text-align:center}.tab-title{overflow:hidden;text-overflow:ellipsis;transition:opacity 0.2s ease}.sidebar.collapsed .tab-title{display:none}.link-tab:hover{background:var(--surface-hover);color:var(--text-primary)}.link-tab.active{background:var(--accent);color:#fff;border-color:rgba(255,255,255,0.2);box-shadow:0 4px 14px var(--accent-glow)}.sidebar-footer{border-top:1px solid var(--border);padding-top:14px;display:flex;flex-direction:column;gap:10px}.theme-toggle-btn{background:var(--surface-hover);border:1px solid var(--border);color:var(--text-primary);padding:10px;border-radius:var(--radius-md);display:flex;align-items:center;gap:12px;cursor:pointer;transition:all 0.2s ease;width:100%;font-weight:600;font-size:13px;outline:none}.sidebar.collapsed .theme-toggle-btn span:last-child{display:none}.theme-toggle-btn:hover{border-color:var(--border-highlight)}.content-viewer{flex:1;display:flex;flex-direction:column;background:var(--bg-main);height:100vh;overflow:hidden;min-width:0}

    /* Right Sidebar Panel */
    .right-sidebar{flex:0 0 var(--right-sidebar-width);width:var(--right-sidebar-width);background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;transition:flex-basis 0.3s cubic-bezier(0.4,0,0.2,1),width 0.3s cubic-bezier(0.4,0,0.2,1),padding 0.3s cubic-bezier(0.4,0,0.2,1);z-index:15;overflow:hidden;padding:16px;gap:14px}

    .right-sidebar.hidden-sidebar{flex:0 0 0 !important;width:0 !important;padding:0 !important;border-left:none !important;overflow:hidden !important}
    .right-sidebar-header{display:flex;align-items:center;justify-content:space-between;min-height:32px;overflow:hidden}
    .right-sidebar-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--text-primary);white-space:nowrap;overflow:hidden}
    .right-sidebar.collapsed .right-sidebar-title span:last-child{display:none}
    
    .right-links-nav{display:flex;flex-direction:column;gap:8px;overflow-y:auto;scrollbar-width:none}.right-links-nav::-webkit-scrollbar{display:none}.right-link-item{border:1px solid transparent;background:transparent;padding:12px;border-radius:var(--radius-md);font-size:13.5px;font-weight:600;color:var(--text-muted);cursor:pointer;transition:all 0.2s ease;display:flex;align-items:center;gap:12px;white-space:nowrap;width:100%;outline:none}.right-link-item .tab-icon{font-size:16px;flex-shrink:0;width:20px;text-align:center}.right-link-item .tab-title{overflow:hidden;text-overflow:ellipsis;transition:opacity 0.2s ease}.right-sidebar.collapsed .right-link-item .tab-title{display:none}.right-link-item:hover{background:var(--surface-hover);color:var(--text-primary)}.right-link-item.clicked-active{background:var(--surface-hover);color:var(--accent);border-color:var(--border-highlight);transform:scale(0.98)}

    .modal-close-btn{background:var(--surface-hover);border:1px solid var(--border);color:var(--text-primary);width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;transition:all 0.2s ease;outline:none}

<body>

<div class="app-container">

    <!-- LEFT SIDEBAR -->
    <aside id="sidebar" class="sidebar">
        <div class="sidebar-top">
            <div class="sidebar-header">
                <div class="brand-info"> 
                    <div class="brand-icon">🔗</div>
                    <div class="brand-text">
                        <h1>Poster Farmating</h1>
                        <p>Content Update</p>
                    </div>
                </div>
                <button id="toggleSidebar" class="collapse-btn" title="Toggle Sidebar" aria-label="Minimize Left Sidebar">◀</button>
            </div>

            <!-- Left Search Bar -->
            <div class="sidebar-search">
                <span class="search-icon">🔍</span>
                <input type="text" id="sidebarSearch" placeholder="Search main link..." autocomplete="off">
            </div>

            <nav id="tabsTrack" class="link-tabs-nav" role="tablist"></nav>
        </div>

        <div class="sidebar-footer">
            <button id="themeToggle" class="theme-toggle-btn" aria-label="Toggle Light/Dark Theme">
                <span id="themeIcon">☾</span>
                <span>Change Theme</span>
            </button>
        </div>
    </aside>

    <!-- CONTENT VIEWER -->
    <main class="content-viewer">
        <div class="viewer-header">
            <div class="viewer-title-group">
                <span class="viewer-indicator"></span>
                <span id="currentTabTitle">Select a link</span>
            </div>

            <!-- Viewer Actions: Fullscreen & Right Sidebar Switch Together -->
            <div class="viewer-actions">
                <button id="fullscreenToggleBtn" class="fullscreen-btn" title="Full Screen">
                    <span id="fullscreenIcon">⛶</span>
                    <span id="fullscreenText">Full Screen</span>
                </button>

                <!-- Right Sidebar Switch Beside Fullscreen Button -->
                <div class="sidebar-switch-wrapper" title="Show/Hide Quick Links Sidebar">
                    <span>Panel:</span>
                    <button id="rightSidebarVisibility" class="sidebar-switch on" aria-label="Show or Hide Right Sidebar"></button> 
                </div>
            </div>
        </div>

        <div class="viewer-body">
            <section id="mainIframeContainer" class="iframe-container">
                <!-- Floating Exit Button for Main Fullscreen -->
                <button id="mainExitFullscreenBtn" class="fullscreen-exit-btn" title="Exit Fullscreen">
                    ✕ Exit Fullscreen
                </button>

                <div id="loadingOverlay" class="loading-overlay active">
                    <div class="spinner"></div>
                    <div class="loading-text">Loading page content...</div>
                </div>

                <iframe 
                    id="linkFrame" 
                    title="Page Viewer Frame"
                    loading="lazy"
                    allow="fullscreen"
                    referrerpolicy="strict-origin-when-cross-origin">
                </iframe>

                <div id="emptyState" class="empty-state">
                    <div class="empty-state-icon">🔗</div>
                    <h3>No Links Available</h3>
                    <p>Please add links to the configuration array.</p>
                </div>
            </section>

            <!-- RIGHT SIDEBAR -->
            <aside id="rightSidebar" class="right-sidebar">
                <div class="right-sidebar-header">
                    <div class="right-sidebar-title">
                        <span>🔗</span>
                        <span>Quick Links</span>
                    </div>
                    <div class="right-sidebar-actions">
                        <button id="toggleRightSidebar" class="collapse-btn" title="Toggle Expand/Collapse" aria-label="Minimize Right Sidebar">‹</button>
                    </div>
                </div>

                <!-- Right Search Bar Added -->
                <div class="sidebar-search">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="rightSidebarSearch" placeholder="Search quick link..." autocomplete="off">
                </div>

                <nav id="rightTabsTrack" class="right-links-nav" role="navigation"></nav>
            </aside>
        </div>
    </main>
</div>

<!-- FULLSCREEN RIGHT LINK POPUP MODAL -->
<div id="rightLinkModal" class="right-link-modal" role="dialog" aria-modal="true">
    <div class="right-link-modal-header">
        <div class="right-link-modal-title">
            <span id="rightModalIcon">🔗</span>
            <span id="rightModalTitle">Page</span>
        </div>
        <div class="right-link-modal-actions">
            <button id="closeRightLinkModal" class="modal-close-btn" aria-label="Close Screen" title="Close">✕</button>
        </div>
    </div>

    <div class="right-link-modal-body">
        <div id="rightModalLoading" class="modal-loading">
            <div class="spinner"></div>
            <span>Loading...</span>
        </div>
        <iframe id="rightLinkFrame" title="Right Link Viewer" allow="fullscreen"></iframe>
    </div>
</div>

<script>

    let currentActiveIndex = 0;

    toggleSidebarBtn.addEventListener("click", () => {
        sidebar.classList.toggle("collapsed");
    });

    // Theme Switcher
    function initTheme() {
        const savedTheme = localStorage.getItem("app-theme") || "dark";
        document.documentElement.setAttribute("data-theme", savedTheme);
        themeIcon.textContent = savedTheme === "dark" ? "☾" : "☀";
    }

    themeToggleBtn.addEventListener("click", () => {
        const currentTheme = document.documentElement.getAttribute("data-theme");
        const newTheme = currentTheme === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", newTheme);
        localStorage.setItem("app-theme", newTheme);
        themeIcon.textContent = newTheme === "dark" ? "☾" : "☀";
    });
    initTheme();

    // Main Frame Fullscreen Logic & Exit Buttons
    fullscreenToggleBtn.addEventListener("click", () => {
        if (!document.fullscreenElement) {
            mainIframeContainer.requestFullscreen().catch(err => {
                alert(`Error: ${err.message}`);
            });
        } else {
            document.exitFullscreen();
        }
    });

    mainExitFullscreenBtn.addEventListener("click", () => {
        if (document.fullscreenElement) {
            document.exitFullscreen();
        }
    });

    document.addEventListener("fullscreenchange", () => {
        if (document.fullscreenElement) {
            fullscreenIcon.textContent = "✕";
            fullscreenText.textContent = "Exit Screen";
        } else {
            fullscreenIcon.textContent = "⛶";
            fullscreenText.textContent = "Full Screen";
        }
    });

    // Render Left Tabs with Search Filter
    function renderTabs(filterText = "") {
        tabsTrack.innerHTML = "";
        const filteredLinks = links.map((item, originalIndex) => ({ ...item, originalIndex }))
                                   .filter(item => item.title.toLowerCase().includes(filterText.toLowerCase()));

        if (filteredLinks.length === 0) {
            tabsTrack.innerHTML = `<div style="padding: 10px; color: var(--text-muted); font-size: 13px; text-align: center;">No matches found</div>`;
            return;
        }

        filteredLinks.forEach((link) => {
            const button = document.createElement("button");
            button.className = "link-tab" + (link.originalIndex === currentActiveIndex ? " active" : "");
            button.role = "tab";
            button.id = `tab-${link.id || link.originalIndex}`;
            button.setAttribute("aria-selected", link.originalIndex === currentActiveIndex ? "true" : "false");
            button.title = link.title;
            button.innerHTML = `
                <span class="tab-icon">${link.icon || "🔗"}</span>
                <span class="tab-title">${link.title}</span>
            `;
            button.addEventListener("click", () => switchTab(link.originalIndex));
            tabsTrack.appendChild(button);
        });
    }

    sidebarSearch.addEventListener("input", (e) => {
        renderTabs(e.target.value);
    });

    function switchTab(index, updateHash = true) {
        if (index < 0 || index >= links.length) return;
        currentActiveIndex = index;
        const selectedData = links[index];

        const allTabs = tabsTrack.querySelectorAll(".link-tab");
        allTabs.forEach(tab => {
            if (tab.id === `tab-${selectedData.id || index}`) {
                tab.classList.add("active");
                tab.setAttribute("aria-selected", "true");
            } else {
                tab.classList.remove("active");
                tab.setAttribute("aria-selected", "false");
            }
        });

        currentTabTitle.textContent = selectedData.title;
        loadingOverlay.classList.add("active");
        frame.src = selectedData.url;

        if (updateHash) {
            const slug = selectedData.id || `link-${index + 1}`;
            history.replaceState(null, "", `#${slug}`);
        }
    }

    frame.addEventListener("load", () => {
        loadingOverlay.classList.remove("active");
    });

    function handleInitialHash() {
        const hash = window.location.hash.replace("#", "");
        if (hash) {
            const foundIndex = links.findIndex((item, idx) => (item.id || `link-${idx + 1}`) === hash);
            if (foundIndex !== -1) {
                switchTab(foundIndex, false);
                return;
            }
        }
        switchTab(0, false);
    }

    if (!links || links.length === 0) {
        tabsTrack.innerHTML = "";
        frame.style.display = "none";
        emptyState.classList.add("active");
        loadingOverlay.classList.remove("active");
        currentTabTitle.textContent = "No Content";
        fullscreenToggleBtn.style.display = "none";
    } else {
        renderTabs();
        handleInitialHash();
    }

    // Right Sidebar Controls
    function initRightSidebarState() {
        const savedState = localStorage.getItem("right-sidebar-state") || "expanded";
        const savedVisibility = localStorage.getItem("right-sidebar-visible") || "true";
        if (savedVisibility === "false") {
            setRightSidebarVisibility(false);
        } else {
            setRightSidebarVisibility(true);
            setRightSidebarCollapsed(savedState === "collapsed");
        }
    }

    function setRightSidebarCollapsed(collapsed) {
        if (collapsed) {
            rightSidebar.classList.add("collapsed");
            toggleRightSidebarBtn.textContent = "›";
            toggleRightSidebarBtn.title = "Expand Right Sidebar";
            if (!rightSidebar.classList.contains("hidden-sidebar")) localStorage.setItem("right-sidebar-state", "collapsed");
        } else {
            rightSidebar.classList.remove("collapsed");
            toggleRightSidebarBtn.textContent = "‹";
            toggleRightSidebarBtn.title = "Minimize Right Sidebar";
            if (!rightSidebar.classList.contains("hidden-sidebar")) localStorage.setItem("right-sidebar-state", "expanded");
        }
    }

    function setRightSidebarVisibility(visible) {
        if (visible) {
            rightSidebar.classList.remove("hidden-sidebar");
            rightSidebarVisibilityBtn.classList.add("on");
            rightSidebarVisibilityBtn.title = "Hide Right Sidebar";
            localStorage.setItem("right-sidebar-visible", "true");
            const savedState = localStorage.getItem("right-sidebar-state") || "expanded";
            setRightSidebarCollapsed(savedState === "collapsed");
        } else {
            rightSidebar.classList.add("hidden-sidebar");
            rightSidebarVisibilityBtn.classList.remove("on");
            rightSidebarVisibilityBtn.title = "Show Right Sidebar";
            localStorage.setItem("right-sidebar-visible", "false");
            localStorage.setItem("right-sidebar-state", "hidden");
        }
    }

    toggleRightSidebarBtn.addEventListener("click", () => {
        setRightSidebarCollapsed(!rightSidebar.classList.contains("collapsed"));
    });

    rightSidebarVisibilityBtn.addEventListener("click", () => {
        setRightSidebarVisibility(!rightSidebarVisibilityBtn.classList.contains("on"));
    });

    // Render Right Tabs with Search Filter
    function renderRightLinks(filterText = "") {
        rightTabsTrack.innerHTML = "";
        if (!rightLinks || rightLinks.length === 0) return;
        
        const filteredRightLinks = rightLinks.filter(item => item.title.toLowerCase().includes(filterText.toLowerCase()));

        if (filteredRightLinks.length === 0) {
            rightTabsTrack.innerHTML = `<div style="padding: 10px; color: var(--text-muted); font-size: 13px; text-align: center;">No matches found</div>`;
            return;
        }

        filteredRightLinks.forEach((link) => {
            const button = document.createElement("button");
            button.className = "right-link-item";
            button.title = link.title;
            button.innerHTML = `
                <span class="tab-icon">${link.icon || "🔗"}</span>
                <span class="tab-title">${link.title}</span>
            `;
            button.addEventListener("click", () => {
                button.classList.add("clicked-active");
                setTimeout(() => button.classList.remove("clicked-active"), 300);
                openRightLink(link);
            });
            rightTabsTrack.appendChild(button);
        });
    }

    rightSidebarSearch.addEventListener("input", (e) => {
        renderRightLinks(e.target.value);
    });

    renderRightLinks();
    initRightSidebarState();

    function openRightLink(link) {
        rightLinkModal.classList.add("active");
        rightModalIcon.textContent = link.icon || "🔗";
        rightModalTitle.textContent = link.title;
        rightModalLoading.classList.remove("hidden");
        rightLinkFrame.src = link.url;
        document.body.classList.add("modal-open");
    }

    function closeRightLinkModal() {
        rightLinkModal.classList.remove("active");
        rightLinkFrame.src = "about:blank";
        document.body.classList.remove("modal-open");
        rightModalLoading.classList.remove("hidden");
    }

    rightLinkFrame.addEventListener("load", () => {
        if (rightLinkFrame.src !== "about:blank" && rightLinkFrame.src !== "") {
            rightModalLoading.classList.add("hidden");
        }
    });

    closeRightLinkModalBtn.addEventListener("click", closeRightLinkModal);
    
    document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
            if (rightLinkModal.classList.contains("active")) {
                closeRightLinkModal();
            }
        }
    });
});
</script>

</body>
</html>
