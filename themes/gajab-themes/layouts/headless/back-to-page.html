<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One-Time Iframe View</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <script>
        // Wo URL jise sirf pehli baar iframe me dikhana hai
        const IFRAME_URL = "/identity-cards/";

        // Wo URL jahan user ko agle visits par redirect karna hai
        const REDIRECT_URL = "/contact-for-tools/";

        // Check karein ki user pehle visit kar chuka hai ya nahi
        if (localStorage.getItem("hasVisitedIframePage") === "true") {
            // Agar pehle se visit kar chuka hai, toh direct redirect karein
            window.location.replace(REDIRECT_URL);
        } else {
            // Agar pehli baar aaya hai, toh flag set karein taaki dobara iframe na dikhe
            localStorage.setItem("hasVisitedIframePage", "true");

            // Page load hone par iframe inject karein
            const iframe = document.createElement("iframe");
            iframe.src = IFRAME_URL;
            iframe.allow = "fullscreen";
            document.body.appendChild(iframe);
        }
    </script>

</body>
</html>
